name: mutter
description: "Modern Mumble client"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Native interop
  ffi: ^2.2.0

  # State management
  flutter_riverpod: ^3.3.1

  # Windows integration
  hotkey_manager: ^0.2.3
  tray_manager: ^0.5.2
  window_manager: ^0.5.1
  flutter_secure_storage: ^10.3.0
  flutter_tts: ^4.2.5
  path_provider: ^2.1.5
  file_selector: ^1.1.0
  audioplayers: ^6.6.0

  # Utilities
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
